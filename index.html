<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>color golf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="match the color in as few tries as you can">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="color golf">
<meta property="og:description" content="match the color in as few tries as you can">
<meta property="og:image" content="https://dglittle.github.io/colorgolf/icon.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: #000; overscroll-behavior: none; }
body { font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
button { font: inherit; border: 0; cursor: pointer; touch-action: manipulation; }

/* the "phone": fills small screens, stays phone-shaped on big ones */
#app { position: relative; margin: 0 auto; width: 100%; max-width: 480px; height: 100%; overflow: hidden; background: #fff; }
@media (min-width: 600px) and (min-height: 700px) {
    body { display: flex; align-items: center; justify-content: center; background: #222; }
    #app { width: 430px; height: 860px; max-height: 96vh; border-radius: 40px; box-shadow: 0 10px 60px #000a; }
}
#app { --u: calc(var(--w, 400px) / 100); }  /* 1u = 1% of the phone's width, set by fit() */

/* ---- home ---- */
.home { height: 100%; display: flex; flex-direction: column; align-items: center; padding: calc(var(--u) * 6); padding-top: max(env(safe-area-inset-top), calc(var(--u) * 6)); overflow-y: auto; }
.title { margin: auto 0 calc(var(--u) * 8); font-size: calc(var(--u) * 11); font-weight: 800; letter-spacing: -0.03em; display: flex; align-items: center; gap: calc(var(--u) * 2); }
.title i { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; background: #ff73c6; box-shadow: inset 0 -0.4em 0 #1c5b21; }
.cards { width: 100%; display: flex; gap: calc(var(--u) * 4); margin-bottom: auto; align-items: flex-start; }
.card { background: #f2f2f2; border-radius: calc(var(--u) * 3); padding: calc(var(--u) * 4); }
.card h2 { margin: 0 0 calc(var(--u) * 2); font-size: calc(var(--u) * 4.2); font-weight: 600; }
.left { flex: 1; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 3); }
.left h2 { margin: 0; }
.right { flex: 1; display: flex; flex-direction: column; gap: calc(var(--u) * 4); }
.score { color: #1a73e8; font-size: calc(var(--u) * 3.6); }
.bubbles { display: grid; grid-template-columns: repeat(3, calc(var(--u) * 9)); gap: calc(var(--u) * 2.5); }
.bubble { width: calc(var(--u) * 9); height: calc(var(--u) * 9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: calc(var(--u) * 4.5); }
.btn { padding: calc(var(--u) * 2.6) calc(var(--u) * 5); border-radius: calc(var(--u) * 2.5); color: #fff; background: #1a73e8; font-size: calc(var(--u) * 4); transition: transform .08s; }
.btn:active { transform: scale(.95); }
.btn.green { background: #34a853; }
.best { font-size: calc(var(--u) * 9); font-weight: 800; }
.version { margin-top: calc(var(--u) * 4); font-size: calc(var(--u) * 2.8); color: #bbb; }
.old { font-size: calc(var(--u) * 3); color: #777; margin-top: calc(var(--u) * 1); }
.stars, .bigstars { text-shadow: 0 0 1px #0007; }
.stars { display: grid; grid-template-columns: repeat(7, 1fr); line-height: 1; font-size: calc(var(--u) * 3.6); text-align: center; }
.bigstars { position: relative; height: calc(var(--u) * 10); margin-top: calc(var(--u) * 1); }
.bigstars span { position: absolute; top: 0; font-size: calc(var(--u) * 10); line-height: 1; }

/* ---- game ---- */
.game { height: 100%; background: #000; color: #fff; display: flex; flex-direction: column; position: relative; }
.goal { height: 33.333%; flex: none; position: relative; z-index: 1; }
.hole, .ball { position: absolute; width: calc(var(--u) * 20); height: calc(var(--u) * 20); margin: calc(var(--u) * -10) 0 0 calc(var(--u) * -10); border-radius: 50%; }
.hole { left: 50%; top: 50%; background: #000; }
.ball.sink { animation: sink .6s ease-out; }
@keyframes sink { 0% { transform: scale(1) } 40% { transform: scale(1.15) } 100% { transform: scale(1) } }
.below > * { transition: opacity .15s; }
.putting .below > * { opacity: 0; pointer-events: none; }
.sinkcv { position: absolute; z-index: 3; pointer-events: none; }
.fly { position: absolute; box-sizing: border-box; border: 2px solid #fff; mix-blend-mode: screen; z-index: 2; }
.below { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: calc(var(--u) * 6) calc(var(--u) * 4) max(env(safe-area-inset-bottom), calc(var(--u) * 4)); }
.info { text-align: center; font-size: calc(var(--u) * 4); line-height: 1.6; }
.info b { font-size: calc(var(--u) * 4.4); }
.rows { display: flex; flex-direction: column; gap: calc(var(--u) * 2.5); touch-action: none; }
.row { display: flex; gap: calc(var(--u) * 1.6); }
.sw { width: calc(var(--u) * 10.5); height: calc(var(--u) * 10.5); border-radius: calc(var(--u) * 1.6); border: calc(var(--u) * 0.8) solid #000; outline: calc(var(--u) * 0.6) solid #555; padding: 0; }
.sw.on { outline-color: #fff; }
.done .sw { outline-color: #000; }
.done .sw.on { outline-color: #fff; }
.wbtn { padding: calc(var(--u) * 3) calc(var(--u) * 6); border-radius: calc(var(--u) * 2.5); background: #fff; color: #000; font-size: calc(var(--u) * 4); transition: transform .08s; }
.wbtn:active { transform: scale(.95); }
.wbtn.quiet { background: #333; color: #ccc; }
.over { text-align: center; }
.over div:first-child { font-size: calc(var(--u) * 6); }
</style>
</head>
<body>
<div id="app"></div>
<script>

// color golf: a color is 3 shades (red, green, blue), each one of 7 values.
// you get 6 tries per color, 9 colors per game, and your score is the total
// number of tries, like golf: lower is better.

var values = [0, 43, 86, 129, 172, 215, 255]
var num_rounds = 9
var max_attempts = 6

var VERSION = 'v0.6 · Oct 29'     // shown small on the home screen; bump it with each change
var app = document.getElementById('app')
var state = load()

function load() {
    try { var s = JSON.parse(localStorage.colorgolf) } catch (e) {}
    s = s || { rounds: [], best: null, holes_in_one: [], view: 'home' }
    if (!s.imported_2014) import_2014(s)
    return s
}

// the 2014 version (same origin, dglittle.github.io) kept its stats in localStorage.colorGolf:
// { stats: { bestScore, holesInOne: [[r, g, b], ...] } }, with shades 0, 42, 85, 127, 170, 212, 255.
// its holes in one come first (they happened first); its best score was over 10 colors, so it's kept apart.
function import_2014(s) {
    s.imported_2014 = true
    try { var old = JSON.parse(localStorage.colorGolf).stats } catch (e) {}
    if (!old) return
    var shade = function (v) { return values[Math.round(v / 255 * 6)] }
    var hio = (old.holesInOne || []).filter(function (c) { return c && c.length == 3 })
    s.holes_in_one = hio.map(function (c) { return c.map(shade) }).concat(s.holes_in_one)
    if (old.bestScore) s.best_2014 = old.bestScore
    try { localStorage.colorgolf = JSON.stringify(s) } catch (e) {}
}
function save() { try { localStorage.colorgolf = JSON.stringify(state) } catch (e) {} }

function css(c) { return 'rgb(' + c.join(',') + ')' }
function same(a, b) { return a[0] == b[0] && a[1] == b[1] && a[2] == b[2] }
function dark(c) { return c[0] * .299 + c[1] * .587 + c[2] * .114 < 128 }
function rand_color() { return [0, 1, 2].map(function () { return values[Math.floor(Math.random() * values.length)] }) }

// "shades away" = how many clicks you'd need to fix your color
function shades_away(a, b) {
    var sum = 0
    for (var i = 0; i < 3; i++) sum += Math.abs(values.indexOf(a[i]) - values.indexOf(b[i]))
    return sum
}

function round_done(r) { return r.attempts >= max_attempts || same(r.last, r.color) }
function score() { return state.rounds.reduce(function (s, r) { return s + r.attempts }, 0) }
function game_done() { var n = state.rounds.length; return n == num_rounds && round_done(state.rounds[n - 1]) }

function new_round() {
    var color = rand_color()
    var start = same(color, [0, 0, 0]) ? [255, 255, 255] : [0, 0, 0]
    state.rounds.push({ color: color, last: start.slice(), guess: start.slice(), attempts: 0 })
}

function next_color() {
    if (state.rounds.length < num_rounds) new_round()
    else state.view = 'home'
    save()
    draw()
}

// a swing: the ball stops shades_away / 18 of the way from the hole to the goal's corner, in a random direction.
// x and y are fractions of the goal's width and height, measured from its center.
function swing_to(r, x, y) {
    r.last = r.guess.slice()
    r.x = x
    r.y = y
    r.attempts++
    if (round_done(r) && r.attempts == 1) state.holes_in_one.push(r.color)
    if (game_done() && (state.best == null || score() < state.best)) state.best = score()
    save()
}

function landing(d, w, h, rad) {
    var X = w / 2 - rad, Y = h / 2 - rad, dist = d / 18 * Math.hypot(X, Y)
    for (var i = 0; i < 200; i++) {
        var a = Math.random() * Math.PI * 2, x = dist * Math.cos(a), y = dist * Math.sin(a)
        if (Math.abs(x) <= X && Math.abs(y) <= Y) return [x / w, y / h]
    }
    var a = Math.random() < .5 ? 1 : -1, b = Math.random() < .5 ? 1 : -1   // only the corners are that far
    return [a * X / w, b * Y / h]
}

// ---- drawing ----

function h(tag, attrs, kids) {
    var e = document.createElement(tag)
    for (var k in attrs || {}) {
        if (k == 'style') Object.assign(e.style, attrs.style)
        else if (k.slice(0, 2) == 'on') e[k] = attrs[k]
        else e.setAttribute(k, attrs[k])
    }
    ;[].concat(kids == null ? [] : kids).forEach(function (c) {
        if (c != null) e.append(c.nodeType ? c : document.createTextNode(c))
    })
    return e
}

function draw() {
    app.innerHTML = ''
    app.append(state.view == 'game' && state.rounds.length ? draw_game() : draw_home())
}

function draw_home() {
    var left = h('div', { class: 'card left' })
    if (state.rounds.length) {
        left.append(h('h2', {}, 'current game'),
            h('div', { class: 'score' }, (game_done() ? 'final' : 'current') + ' score: ' + score()))
        var bubbles = h('div', { class: 'bubbles' })
        for (var i = 0; i < num_rounds; i++) {
            var r = state.rounds[i]
            bubbles.append(r ? h('div', { class: 'bubble', style: { background: css(r.color), color: dark(r.color) ? '#fff' : '#000' } },
                round_done(r) ? '' + r.attempts : '…') : h('div', { class: 'bubble' }))
        }
        left.append(bubbles)
        if (!game_done()) left.append(h('button', { class: 'btn', onclick: function () { state.view = 'game'; save(); draw() } }, 'continue game'))
    }
    left.append(h('button', { class: 'btn green', onclick: function () {
        state.rounds = []
        new_round()
        state.view = 'game'
        save()
        draw()
    } }, 'new game'))

    // 49 small stars, and a big star for every 50th hole in one
    var hio = state.holes_in_one, sets = Math.floor(Math.max(0, hio.length - 1) / 50), base = sets * 50
    function star(i) { return h('span', { style: { color: i < hio.length ? css(hio[i]) : '#d0d0d0' } }, '★') }
    var stars = h('div', { class: 'stars' })
    for (var i = 0; i < 49; i++) stars.append(star(base + i))
    var big = h('div', { class: 'bigstars' })
    for (var s = 0; s <= sets; s++) {
        var b = star(s * 50 + 49)
        b.style.left = sets ? 'calc(' + (s / sets) + ' * (100% - 1em))' : 'calc(50% - .5em)'
        big.append(b)
    }

    return h('div', { class: 'home' }, [
        h('div', { class: 'title' }, [h('i'), 'colorgolf']),
        h('div', { class: 'cards' }, [
            left,
            h('div', { class: 'right' }, [
                h('div', { class: 'card' }, [h('h2', {}, 'best score'), h('div', { class: 'best' }, state.best == null ? '--' : '' + state.best),
                    state.best_2014 ? h('div', { class: 'old' }, 'best in 2014 (10 colors): ' + state.best_2014) : null]),
                h('div', { class: 'card' }, [h('h2', {}, 'holes in one'), stars, big])
            ])
        ]),
        h('div', { class: 'version' }, VERSION)
    ])
}

var sink_next = false
function draw_game() {
    var r = state.rounds[state.rounds.length - 1], done = round_done(r), won = same(r.last, r.color)

    var goal = h('div', { class: 'goal', style: { background: css(r.color) } })
    var hole = h('div', { class: 'hole' })
    var ball = h('div', { class: 'ball' + (sink_next ? ' sink' : ''), style: { background: css(r.last),
        left: (50 + 100 * (r.x || 0)) + '%', top: (50 + 100 * (r.y || 0)) + '%' } })
    sink_next = false
    if (!won) goal.append(hole)
    if (r.attempts) goal.append(ball)

    var status = won ? (r.attempts == 1 ? [h('span', {}, 'hole in one! '), h('span', { style: { color: css(r.color) } }, '★')] : 'you matched the color in ' + r.attempts + ' tries!')
        : done ? 'color not matched.'
        : shades_away(r.last, r.color) + ' shades away'

    var rows = h('div', { class: 'rows' + (done ? ' done' : '') })
    ;[0, 1, 2].forEach(function (ch) {
        var row = h('div', { class: 'row' })
        values.forEach(function (v) {
            var c = [0, 0, 0]
            c[ch] = v
            var show = !done || v == r.color[ch]   // when the round ends, only the answer stays lit
            row.append(h('button', { class: 'sw' + (r.guess[ch] == v ? ' on' : ''), 'data-ch': ch, 'data-v': v,
                style: { background: show ? css(c) : '#000' } }))
        })
        rows.append(row)
    })
    if (!done) slide(rows, function (ch, v) {
        if (r.guess[ch] == v) return
        r.guess[ch] = v
        save()
        rows.querySelectorAll('[data-ch="' + ch + '"]').forEach(function (b) { b.classList.toggle('on', b.dataset.v == v) })
    })

    var game = h('div', { class: 'game' })
    var action = game_done() ? h('div', { class: 'over' }, [h('div', {}, 'game over'), h('div', {}, 'final score: ' + score())])
        : h('button', { class: 'wbtn', onclick: done ? next_color : function () { putt(game, goal, hole, rows, r) } }, done ? 'next color' : 'swing')

    game.append(goal, h('div', { class: 'below' }, [
        h('div', { class: 'info' }, [
            h('div', {}, 'color ' + state.rounds.length + ' of ' + num_rounds + (done ? '' : ' · try ' + (r.attempts + 1) + ' of ' + max_attempts)),
            h('b', {}, status)
        ]),
        rows,
        action,
        h('button', { class: 'wbtn quiet', onclick: function () { state.view = 'home'; save(); draw() } }, 'menu')
    ]))
    return game
}

// the swing animation (from the 2025 app): the three chosen shades fly together and add up into your color,
// then the ball shoots up into the goal and rolls to a stop, as far from the hole as you are shades away
var putting = false
function putt(game, goal, hole, rows, r) {
    if (putting) return
    var G = game.getBoundingClientRect(), gr = goal.getBoundingClientRect(), R = rows.getBoundingClientRect()
    var size = hole.offsetWidth, d = shades_away(r.guess, r.color)
    var to = d ? landing(d, gr.width, gr.height, size / 2) : [0, 0]
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { swing_to(r, to[0], to[1]); sink_next = !d; return draw() }
    putting = true
    game.classList.add('putting')
    var cx = R.left + R.width / 2 - G.left, cy = R.top + R.height / 2 - G.top
    var sink = !d && pick_sink()
    var flies = [0, 1, 2].map(function (ch) {
        var b = rows.querySelector('.sw.on[data-ch="' + ch + '"]').getBoundingClientRect(), c = [0, 0, 0]
        c[ch] = r.guess[ch]
        var f = h('div', { class: 'fly', style: { background: css(c) } })
        game.append(f)
        f.animate([
            { left: b.left - G.left + 'px', top: b.top - G.top + 'px', width: b.width + 'px', height: b.height + 'px', borderRadius: '12%', borderColor: '#fff' },
            { left: cx - size / 2 + 'px', top: cy - size / 2 + 'px', width: size + 'px', height: size + 'px', borderRadius: '50%', borderColor: 'transparent' }
        ], { duration: 600, easing: 'ease-in-out', fill: 'forwards' })
        return f
    })
    setTimeout(function () {
        if (sink) {
            // a match: the ball rises from where it formed to where every sink animation starts its flight (75/390 of the width
            // below the goal), speeding up so it arrives at the speed the animation's flight starts with; then the animation plays
            flies.forEach(function (f) { f.remove() })
            var sc = gr.width / 390, y1 = gr.bottom - G.top + 75 * sc, dist = cy - y1, v = 3 * 215.5 * sc / sink.set.FLY
            var ball = h('div', { class: 'fly', style: { background: css(r.guess), border: '0', borderRadius: '50%',
                left: cx - size / 2 + 'px', top: cy - size / 2 + 'px', width: size + 'px', height: size + 'px' } })
            game.append(ball)
            var go = function () { play_sink(sink, game, goal, [ball], r, function () { putting = false; swing_to(r, 0, 0); draw() }) }
            if (dist <= 1) return go()
            var ms = 2 * dist / v * 1000                            // ease-in (x²): ends at speed 2·dist/time = v
            ball.animate([{ top: cy - size / 2 + 'px' }, { top: y1 - size / 2 + 'px' }], { duration: ms, easing: 'cubic-bezier(.333, 0, .667, .333)', fill: 'forwards' })
            return setTimeout(go, ms)
        }
        flies.forEach(function (f) { f.remove() })
        var ball = h('div', { class: 'ball', style: { background: css(r.guess) } })
        goal.append(ball)
        var x0 = cx - (gr.left - G.left), y0 = cy - (gr.top - G.top)
        ball.animate([
            { left: x0 + 'px', top: y0 + 'px' },
            { left: gr.width * (.5 + to[0]) + 'px', top: gr.height * (.5 + to[1]) + 'px' }
        ], { duration: 300, easing: 'ease-out', fill: 'forwards' })
        setTimeout(function () {
            putting = false
            swing_to(r, to[0], to[1])
            sink_next = !d
            draw()
        }, 320)
    }, 600)
}

// ---- the sink animations: one plays, at random, each time a swing matches ----
// Each set (review/sets/*.js, copied in below by tools/build-sinks.js) draws a 390×420 picture: the goal is its top 281 px,
// with the hole (radius 39) in the middle, and the black swatch area below, where the ball starts its flight at y = 356.
// We draw that offscreen, then copy its goal part onto the goal (centered on the hole) and its lower part just below the goal.
var SETS = []
var SINKS = []
function pick_sink() {
    if (!SINKS.length) SETS.forEach(function (S) { var set = S.make(); set.ideas.forEach(function (d, i) { SINKS.push({ set: set, i: i, dur: set.FLY + d.dur, name: S.id + '/' + d.name }) }) })
    return SINKS[Math.floor(Math.random() * SINKS.length)]
}
function play_sink(k, game, goal, flies, r, done) {
    var G = game.getBoundingClientRect(), gr = goal.getBoundingClientRect(), sc = gr.width / 390, dpr = Math.min(2, window.devicePixelRatio || 1)
    var below = 139 * sc, cv = h('canvas', { class: 'sinkcv' })
    cv.width = Math.round(gr.width * dpr); cv.height = Math.round((gr.height + below) * dpr)
    Object.assign(cv.style, { left: gr.left - G.left + 'px', top: gr.top - G.top + 'px', width: gr.width + 'px', height: gr.height + below + 'px' })
    var off = document.createElement('canvas'); off.width = Math.round(390 * sc * dpr); off.height = Math.round(420 * sc * dpr)
    var og = off.getContext('2d'), g = cv.getContext('2d'), K = sc * dpr
    var dy = gr.height / 2 - 140.5 * sc                        // put the picture's hole on the goal's center
    function frame(t) {
        og.setTransform(K, 0, 0, K, 0, 0); k.set.setCol(r.color); k.set.frame(og, k.i, t)
        g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height)
        g.save(); g.beginPath(); g.rect(0, 0, cv.width, gr.height * dpr); g.clip()
        g.drawImage(off, 0, 0, off.width, 281 * K, 0, dy * dpr, cv.width, 281 * K); g.restore()
        g.drawImage(off, 0, 281 * K, off.width, 139 * K, 0, gr.height * dpr, cv.width, 139 * K)
    }
    frame(0)
    game.append(cv)
    flies.forEach(function (f) { f.remove() })
    var t0 = performance.now()
    ;(function tick(now) {
        var t = (now - t0) / 1000
        frame(Math.min(t, k.dur))
        if (t < k.dur) return requestAnimationFrame(tick)
        cv.remove()
        done()
    })(t0)
}

// tap or drag along a row of swatches
function slide(rows, cb) {
    function at(e) {
        var t = e.touches ? e.touches[0] : e
        var el = document.elementFromPoint(t.clientX, t.clientY)
        return el && el.dataset && el.dataset.ch != null ? el : null
    }
    var ch = null
    function down(e) {
        var el = at(e)
        if (!el) return
        e.preventDefault()
        ch = el.dataset.ch
        cb(+ch, +el.dataset.v)
    }
    function move(e) {
        if (ch == null) return
        var el = at(e)
        if (el && el.dataset.ch == ch) cb(+ch, +el.dataset.v)
    }
    function up() { ch = null }
    rows.addEventListener('pointerdown', down)
    rows.addEventListener('pointermove', move)
    window.addEventListener('pointerup', up)
}

function fit() { app.style.setProperty('--w', app.clientWidth + 'px') }
window.addEventListener('resize', fit)
fit()
draw()

</script>
<script>

// ---- 2-solid.js

function pick() {

var cl = function (x) { return Math.max(0, Math.min(1, x)) }

var eo = function (x) { return 1 - Math.pow(1 - cl(x), 3) }

        { name: 'register', note: 'Three colored impressions separate from the join, slide back into registration, and disappear together on the bloop.', dur: 1.02, finish: 1.02, voice: [560, 135, .18],
